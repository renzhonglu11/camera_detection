[project]
name = "camera-detection-agent"
version = "0.1.0"
description = "Python agent environment for the Raspberry Pi camera application."
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=2.55.0,<3.0.0",
]

[project.scripts]
camera-agent = "camera_agent.entry:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_agent"]
